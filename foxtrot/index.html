<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Keeps this hidden page out of Google & search engine results -->
    <meta name="robots" content="noindex, nofollow">
    <title>Anup Shirke | AI Avatar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f17; color: #e2e8f0; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 bg-radial-gradient">

    <div class="w-full max-w-3xl glass-panel rounded-2xl shadow-2xl flex flex-col h-[85vh] sm:h-[750px] overflow-hidden">
        
        <!-- Header -->
        <header class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-800 bg-slate-900/50">
            <div class="flex items-center gap-3.5">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/20">
                        AS
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="font-semibold text-base text-white flex items-center gap-2">
                        Anup Shirke
                        <span class="text-[10px] font-mono uppercase bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full">AI Persona</span>
                    </h1>
                    <p class="text-xs text-slate-400">Digital Marketing, AI Strategy & Tech</p>
                </div>
            </div>
            <span class="text-xs font-mono text-slate-500 bg-slate-800/80 px-2.5 py-1 rounded-md border border-slate-700/50">/foxtrot</span>
        </header>

        <!-- Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 chat-scroll">
            <!-- Initial AI Message -->
            <div class="flex items-start gap-3 max-w-[85%]">
                <div class="w-7 h-7 rounded-full bg-blue-600/30 border border-blue-500/40 text-blue-400 flex items-center justify-center text-xs font-bold shrink-0 mt-1">AI</div>
                <div class="bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl rounded-tl-sm text-sm text-slate-200 leading-relaxed shadow-sm">
                    Hey! You found the hidden route 👋<br><br>
                    I'm Anup's AI avatar. Ask me about my experience in digital marketing & AI, my projects, tech stack, gaming, or anything else you're curious about!
                </div>
            </div>
        </main>

        <!-- Prompt Suggestions -->
        <div class="px-4 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto text-xs whitespace-nowrap border-t border-slate-800/60 bg-slate-950/40">
            <span class="text-slate-500 font-medium">Quick ask:</span>
            <button onclick="sendQuickPrompt('What is your background in Digital Marketing & AI?')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full transition">Digital Marketing & AI</button>
            <button onclick="sendQuickPrompt('What projects are you currently working on?')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full transition">Projects</button>
            <button onclick="sendQuickPrompt('What gaming or tech gear do you use?')" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-full transition">Gaming & Tech</button>
        </div>

        <!-- Input Section -->
        <footer class="p-3 sm:p-4 border-t border-slate-800 bg-slate-900/60">
            <form id="chat-form" onsubmit="handleFormSubmit(event)" class="flex gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                    class="flex-1 bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-500 transition shadow-inner"
                >
                <button 
                    type="submit" 
                    class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-5 py-3 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-blue-600/20"
                >
                    Send
                </button>
            </form>
        </footer>

    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function appendMessage(role, text) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-3 ${isUser ? 'justify-end' : ''} max-w-[85%] ${isUser ? 'ml-auto' : ''}`;

            if (!isUser) {
                wrapper.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-blue-600/30 border border-blue-500/40 text-blue-400 flex items-center justify-center text-xs font-bold shrink-0 mt-1">AI</div>
                    <div class="bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl rounded-tl-sm text-sm text-slate-200 leading-relaxed shadow-sm">${text}</div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tr-sm text-sm leading-relaxed shadow-md shadow-blue-600/10">${text}</div>
                `;
            }

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // Simulated response logic representing Anup Shirke
            setTimeout(() => {
                let response = "Thanks for asking! I'm focused on combining Digital Marketing with AI Strategy, optimizing systems, and exploring tech & gaming. Feel free to ask more!";
                
                const lower = text.toLowerCase();
                if (lower.includes('marketing') || lower.includes('ai') || lower.includes('background')) {
                    response = "I specialize in Digital Marketing & AI Strategy, focusing on performance growth, modern analytics, and leveraging automation tools to scale campaigns effectively.";
                } else if (lower.includes('project') || lower.includes('work')) {
                    response = "I work on digital strategy, marketing systems, and personal tech tools. You can check out my main portfolio for featured client work and case studies!";
                } else if (lower.includes('game') || lower.includes('tech') || lower.includes('gear')) {
                    response = "Outside of work, I'm into gaming (PS5, PC, Call of Duty) and exploring audio gear and custom tech setups.";
                }

                appendMessage('ai', response);
            }, 600);
        }

        function sendQuickPrompt(promptText) {
            userInput.value = promptText;
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Keeps this hidden page out of Google & search engine results -->
  <meta name="robots" content="noindex, nofollow">
  <title>ANUP_SHIRKE::FOXTROT_AI</title>
  <!-- Link to the new Matrix styles -->
  <link rel="stylesheet" href="matrix.css">
</head>
<body>

  <!-- The Background Animation Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <!-- The Chat Terminal -->
  <div class="terminal-container">
    <div class="terminal-header">
      [ ANUP SHIRKE | FOXTROT AI INTEL ]
    </div>
    
    <div class="chat-output" id="chat-output">
      <div class="message ai">
        <span class="message-prefix">[anup]:</span>
        <span class="message-text">hi </span>
      </div>
    </div>

    <div class="input-area">
      <span class="message-prefix">&gt;&gt;</span>
      <input type="text" id="user-input" placeholder="Query data..._" autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    // --- PART 1: The Matrix Background Animation (Code Rain) ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    // Set canvas to full screen
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    // Katakana characters (and other characters)
    const characters = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const charArray = characters.split('');

    const fontSize = 16;
    const columns = canvas.width / fontSize; // number of columns for the rain

    // An array of drops - one per column
    const drops = [];
    // Initialize drops. y=1 for the starting point
    for (let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    // Drawing the characters
    function draw() {
      // Black background for the canvas with translucency
      // This creates the trail effect as characters fade
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0'; // Green text
      ctx.font = fontSize + 'px arial';

      // Looping over drops
      for (let i = 0; i < drops.length; i++) {
        // Choose a random character
        const text = charArray[Math.floor(Math.random() * charArray.length)];
        
        // x coordinate = column index * fontSize, y coordinate = drop value * fontSize
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        // Sending the drop back to the top randomly after it has crossed the screen
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        // Incrementing Y coordinate
        drops[i]++;
      }
    }

    // Call the draw function repeatedly
    setInterval(draw, 33); // Approximately 30 FPS


    // --- PART 2: Chatbot Logic (Anup's AI Persona) ---
    const inputField = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatOutput = document.getElementById('chat-output');

    // Function to add a message to the terminal
    function addMessage(prefix, text, type) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const prefixSpan = document.createElement('span');
      prefixSpan.className = 'message-prefix';
      prefixSpan.innerText = `[${prefix.toUpperCase()}]:`;

      const textSpan = document.createElement('span');
      textSpan.className = 'message-text';
      textSpan.innerText = text;

      messageDiv.appendChild(prefixSpan);
      messageDiv.appendChild(textSpan);
      chatOutput.appendChild(messageDiv);

      // Auto-scroll to bottom
      chatOutput.scrollTop = chatOutput.scrollHeight;
    }

    // Function to handle the simulated AI response
    function generateAIResponse(userMessage) {
      const message = userMessage.toLowerCase();
      let response = "COMMAND NOT RECOGNIZED. Provide data regarding Anup's expertise (Digital Marketing, AI, Tech)._";

      // Basic response routing based on keywords
      if (message.includes('hello') || message.includes('hi')) {
        response = "Connection acknowledged. I am Anup Shirke's AI avatar, specialized in Digital Marketing & AI Strategy optimization._";
      } else if (message.includes('marketing') || message.includes('digital') || message.includes('strategy')) {
        response = "Anup has extensive experience scaling performance marketing campaigns and integrating AI tools to maximize strategy ROI. Data indicates high proficiency._";
      } else if (message.includes('project') || message.includes('work')) {
        response = "Anup's portfolio is classified. Main assets can be verified via the root domain (anupshirke-portfolio). I handle strategic intelligence._";
      } else if (message.includes('game') || message.includes('gaming') || message.includes('tech') || message.includes('ps5')) {
        response = "When not optimizing marketing systems, Anup engages in high-level gaming (PS5, Call of Duty) and explores new hardware configurations._";
      }

      // Add AI response after a slight delay
      setTimeout(() => {
        addMessage('Anup_AI', response, 'ai');
      }, 700);
    }

    // Main function to handle user input
    function handleSendMessage() {
      const text = inputField.value.trim();
      if (text === "") return;

      // Add user message
      addMessage('User', text, 'user');
      inputField.value = ""; // Clear input

      // Trigger AI response
      generateAIResponse(text);
    }

    // Event listeners
    sendBtn.addEventListener('click', handleSendMessage);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleSendMessage();
      }
    });

  }
  </script>
</body>
</html>

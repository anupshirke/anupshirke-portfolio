<script>
const toggle = document.getElementById('theme-toggle');
const html = document.documentElement;
const saved = localStorage.getItem('theme') || 'dark';
html.setAttribute('data-theme', saved);
toggle.textContent = saved === 'dark' ? '☀' : '☾';
toggle.addEventListener('click', ()=>{
  const cur = html.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  toggle.textContent = next === 'dark' ? '☀' : '☾';
});
// flip clock
const roles = ['digital marketer','creative designer','vibe coder'];
let idx=0;
const clock = document.getElementById('flip-clock');
if(clock){
  setInterval(()=>{
    clock.classList.add('flip');
    setTimeout(()=>{
      idx = (idx+1)%roles.length;
      clock.textContent = roles[idx];
      clock.classList.remove('flip');
    },200);
  },2500);
}
</script>
